name: Bug report
description: Something in the HandlePilot MCP server, the plugin or these docs doesn't work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Never paste a token (`hp_...`), an email sign-in link or anything else private here.
  - type: dropdown
    id: client
    attributes:
      label: Client
      options:
        - claude.ai / Claude Desktop / Claude mobile
        - Claude Code (manual setup)
        - Claude Code (plugin)
        - ChatGPT
        - Codex
        - Cursor
        - VS Code
        - Other
    validations:
      required: true
  - type: dropdown
    id: auth
    attributes:
      label: How you connect
      options:
        - OAuth sign-in
        - Personal token
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool or skill involved
      placeholder: e.g. watch_video, create_carousel, /handlepilot:strategy
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you asked, what the agent or tool answered (error code and message if there was one), and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: when
    attributes:
      label: When it happened (date, time and timezone)
